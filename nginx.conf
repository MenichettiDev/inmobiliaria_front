# nginx.conf para el contenedor frontend (SPA Angular)
# Este nginx corre DENTRO del contenedor frontend en puerto 80
# El proxy reverso externo (caddy/nginx-proxy) maneja SSL

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;

    # Assets con hash → cache agresivo (content-addressable)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html → sin cache (siempre actualizado)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA: todas las rutas Angular van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check interno
    location = /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
