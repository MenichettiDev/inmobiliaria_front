<div class="propiedades-container">
  <div
    class="page-header d-flex justify-content-between align-items-center mb-4"
  >
    <h1><i class="bi bi-house-door"></i> Propiedades</h1>
    <button class="btn btn-primary" (click)="crearPropiedad()">
      <i class="bi bi-plus-circle"></i> Nueva Propiedad
    </button>
  </div>

  <!-- Filtros -->
  <div class="filtros-section mb-4">
    <div class="row">
      <div class="col-md-2">
        <label class="form-label">Estado Administrativo</label>
        <select
          class="form-select"
          [(ngModel)]="filtros.estadoAdministrativo"
          (change)="aplicarFiltros()"
        >
          <option value="">Todos</option>
          <option
            *ngFor="let estado of estadosAdministrativos"
            [value]="estado.id"
          >
            {{ estado.nombre }}
          </option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Estado Comercial</label>
        <select
          class="form-select"
          [(ngModel)]="filtros.estadoComercial"
          (change)="aplicarFiltros()"
        >
          <option value="">Todos</option>
          <option *ngFor="let estado of estadosComerciales" [value]="estado.id">
            {{ estado.nombre }}
          </option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Tipo</label>
        <select
          class="form-select"
          [(ngModel)]="filtros.tipo"
          (change)="aplicarFiltros()"
        >
          <option value="">Todos</option>
          <option *ngFor="let tipo of tipos" [value]="tipo.id">
            {{ tipo.nombre }}
          </option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Agente</label>
        <select
          class="form-select"
          [(ngModel)]="filtros.agente"
          (change)="aplicarFiltros()"
        >
          <option value="">Todos</option>
          <option *ngFor="let agente of agentes" [value]="agente.id">
            {{ agente.nombre }}
          </option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Búsqueda</label>
        <input
          type="text"
          class="form-control"
          placeholder="Buscar propiedades..."
          [(ngModel)]="filtros.busqueda"
          (input)="aplicarFiltros()"
        />
      </div>
      <div class="col-md-1 d-flex align-items-end">
        <button class="btn btn-secondary" (click)="limpiarFiltros()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Listado de Propiedades -->
  <div class="propiedades-grid">
    <div class="row">
      <div
        class="col-md-6 col-lg-4 mb-4"
        *ngFor="let propiedad of propiedadesFiltradas"
      >
        <div class="propiedad-card">
          <div class="propiedad-imagen">
            <img
              [src]="propiedad.imagen"
              [alt]="propiedad.titulo"
              class="img-fluid"
            />
            <div class="propiedad-badges">
              <span class="badge bg-primary">{{ propiedad.tipo }}</span>
              <span
                class="badge"
                [ngClass]="
                  'bg-' + obtenerColorEstado(propiedad.estadoComercial)
                "
              >
                {{ propiedad.estadoComercial }}
              </span>
            </div>
          </div>
          <div class="propiedad-contenido p-3">
            <h5 class="propiedad-titulo">{{ propiedad.titulo }}</h5>
            <p class="propiedad-precio mb-2">
              <strong>${{ propiedad.precio | number }}</strong>
            </p>
            <p class="propiedad-agente mb-3">
              <i class="bi bi-person"></i> {{ propiedad.agente }}
            </p>
            <div class="propiedad-actions">
              <button
                class="btn btn-sm btn-outline-primary"
                (click)="editarPropiedad(propiedad.id)"
              >
                <i class="bi bi-pencil"></i> Editar
              </button>
              <button
                class="btn btn-sm btn-outline-warning"
                (click)="cambiarEstado(propiedad.id)"
              >
                <i class="bi bi-arrow-repeat"></i> Estado
              </button>
              <button
                class="btn btn-sm btn-outline-success"
                (click)="publicarPropiedad(propiedad.id)"
              >
                <i class="bi bi-broadcast"></i> Publicar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Si no hay propiedades -->
  <div *ngIf="propiedadesFiltradas.length === 0" class="text-center py-5">
    <i class="bi bi-house-door display-1 text-muted"></i>
    <h3 class="text-muted">No se encontraron propiedades</h3>
    <p class="text-muted">
      Prueba ajustando los filtros o crea una nueva propiedad.
    </p>
  </div>
</div>
