<div class="container-fluid mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header">
          <h4 class="mb-0">
            <i class="fas fa-plus me-2"></i>
            Crear Nueva Propiedad
          </h4>
        </div>
        <div class="card-body">
          <form [formGroup]="propiedadForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-md-12 mb-3">
                <label class="form-label">
                  Título <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="titulo"
                  [class.is-invalid]="isFieldInvalid('titulo')"
                  placeholder="Título de la propiedad"
                />
                <div class="invalid-feedback">
                  {{ getFieldError('titulo') }}
                </div>
              </div>

              <div class="col-md-12 mb-3">
                <label class="form-label">
                  Descripción <span class="text-danger">*</span>
                </label>
                <textarea
                  class="form-control"
                  formControlName="descripcion"
                  [class.is-invalid]="isFieldInvalid('descripcion')"
                  placeholder="Descripción de la propiedad"
                  rows="4"
                ></textarea>
                <div class="invalid-feedback">
                  {{ getFieldError('descripcion') }}
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Precio</label>
                <input
                  type="number"
                  class="form-control"
                  formControlName="precio"
                  [class.is-invalid]="isFieldInvalid('precio')"
                  placeholder="Precio de venta"
                  min="0"
                  step="0.01"
                />
                <div class="invalid-feedback">
                  {{ getFieldError('precio') }}
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">
                  Dirección <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="direccion"
                  [class.is-invalid]="isFieldInvalid('direccion')"
                  placeholder="Dirección completa"
                />
                <div class="invalid-feedback">
                  {{ getFieldError('direccion') }}
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Latitud</label>
                <input
                  type="number"
                  class="form-control"
                  formControlName="latitud"
                  placeholder="Coordenada latitud"
                  step="any"
                />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Longitud</label>
                <input
                  type="number"
                  class="form-control"
                  formControlName="longitud"
                  placeholder="Coordenada longitud"
                  step="any"
                />
              </div>

              <div class="col-md-12 mb-3">
                <label class="form-label">Agente Responsable</label>
                <app-cbo-usuario
                  [ngModel]="propiedadForm.get('idAgenteResponsable')?.value"
                  (ngModelChange)="onUsuarioAsignadoChange($event)"
                  placeholder="Seleccionar agente responsable"
                  [showOnlyActive]="true"
                ></app-cbo-usuario>
              </div>
            </div>

            <div *ngIf="error" class="alert alert-danger mb-3">
              <i class="fas fa-exclamation-triangle me-2"></i>
              {{ error }}
            </div>

            <div class="d-flex gap-2">
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="loading || propiedadForm.invalid"
              >
                <span
                  *ngIf="loading"
                  class="spinner-border spinner-border-sm me-1"
                ></span>
                <i *ngIf="!loading" class="fas fa-save me-1"></i>
                {{ loading ? 'Guardando...' : 'Crear Propiedad' }}
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                (click)="onCancel()"
                [disabled]="loading"
              >
                <i class="fas fa-times me-1"></i>
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
