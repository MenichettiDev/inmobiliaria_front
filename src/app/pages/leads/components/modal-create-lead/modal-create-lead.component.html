<!-- Modal Crear Lead -->
<div
  *ngIf="mostrar"
  class="modal-backdrop"
  (click)="onBackdropClick($event)"
></div>

<div
  class="modal"
  [class.show]="mostrar"
  [style.display]="mostrar ? 'block' : 'none'"
  tabindex="-1"
  role="dialog"
  style="z-index: 1055"
>
  <div class="modal-dialog" role="document" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
          <i class="fas fa-plus me-2"></i>
          Crear Nuevo Lead
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          (click)="cerrarModal()"
          aria-label="Close"
          [disabled]="loading"
        ></button>
      </div>
      <div class="modal-body">
        <!-- Error Alert -->
        <div *ngIf="error" class="alert alert-danger" role="alert">
          <i class="fas fa-exclamation-triangle me-1"></i>
          {{ error }}
        </div>

        <form #leadForm="ngForm" (ngSubmit)="crearLead()">
          <div class="mb-3">
            <label class="form-label">
              Nombre Completo <span class="text-danger">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="nuevoLead.nombreCompleto"
              name="nombreCompleto"
              required
              #nombreCompleto="ngModel"
              placeholder="Nombre y apellido del lead"
              [disabled]="loading"
            />
            <div
              *ngIf="nombreCompleto.invalid && nombreCompleto.touched"
              class="text-danger small mt-1"
            >
              El nombre completo es requerido
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              [(ngModel)]="nuevoLead.email"
              name="email"
              #email="ngModel"
              placeholder="email@ejemplo.com"
              [disabled]="loading"
            />
            <div
              *ngIf="email.invalid && email.touched"
              class="text-danger small mt-1"
            >
              Ingresa un email válido
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input
              type="tel"
              class="form-control"
              [(ngModel)]="nuevoLead.telefono"
              name="telefono"
              placeholder="Ej: +54 9 11 1234-5678"
              [disabled]="loading"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">
              Fuente <span class="text-danger">*</span>
            </label>
            <select
              class="form-select"
              [(ngModel)]="nuevoLead.idFuente"
              name="idFuente"
              required
              [disabled]="loading"
            >
              <option *ngFor="let fuente of fuentes" [value]="fuente.id">
                {{ fuente.nombre }}
              </option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Agente Asignado</label>
            <app-cbo-usuario
              [ngModel]="nuevoLead.idUsuarioAsignado"
              (ngModelChange)="onUsuarioAsignadoChange($event)"
              name="idUsuarioAsignado"
              placeholder="Sin asignar"
              [showOnlyActive]="true"
              [disabled]="loading"
            ></app-cbo-usuario>
            <div class="form-text">
              Opcional. Puedes asignar el lead a un agente específico.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Propiedad de Interés</label>
            <app-cbo-propiedades
              [ngModel]="nuevoLead.idPropiedad"
              (ngModelChange)="onPropiedadChange($event)"
              name="idPropiedad"
              placeholder="Ninguna propiedad específica"
              [disabled]="loading"
            ></app-cbo-propiedades>
            <div class="form-text">
              Opcional. Selecciona la propiedad por la que el lead mostró
              interés.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Observaciones</label>
            <textarea
              class="form-control"
              [(ngModel)]="nuevoLead.observaciones"
              name="observaciones"
              rows="4"
              placeholder="Notas iniciales sobre el lead..."
              [disabled]="loading"
            ></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="cerrarModal()"
          [disabled]="loading"
        >
          <i class="fas fa-times me-1"></i>
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-primary"
          (click)="crearLead()"
          [disabled]="loading || !leadForm.form.valid"
        >
          <span
            *ngIf="loading"
            class="spinner-border spinner-border-sm me-1"
          ></span>
          <i *ngIf="!loading" class="fas fa-save me-1"></i>
          {{ loading ? "Creando..." : "Crear Lead" }}
        </button>
      </div>
    </div>
  </div>
</div>
