<div class="cbo-container">
  <div class="cbo-dropdown" [class.disabled]="disabled">
    <div
      class="cbo-selected"
      (click)="toggleDropdown()"
      [class.open]="isOpen"
      [class.has-value]="selectedUsuario"
    >
      <div class="cbo-content">
        <div *ngIf="selectedUsuario" class="selected-usuario">
          <div class="usuario-info">
            <span class="usuario-nombre">{{ selectedUsuario.nombre }}</span>
            <small *ngIf="showEmail" class="usuario-email text-muted">{{
              selectedUsuario.email
            }}</small>
          </div>
          <span class="usuario-rol badge bg-secondary">{{
            selectedUsuario.rolNombre
          }}</span>
        </div>
        <span *ngIf="!selectedUsuario" class="placeholder">{{
          placeholder
        }}</span>
      </div>
      <i class="bi bi-chevron-down cbo-arrow" [class.rotated]="isOpen"></i>
    </div>

    <div *ngIf="isOpen" class="cbo-dropdown-menu" (blur)="closeDropdown()">
      <div class="cbo-search">
        <input
          type="text"
          class="form-control form-control-sm"
          placeholder="Buscar usuario..."
          [(ngModel)]="searchTerm"
          (input)="onSearchChange()"
          (click)="$event.stopPropagation()"
        />
      </div>

      <div *ngIf="loading" class="cbo-loading">
        <div class="spinner-border spinner-border-sm" role="status"></div>
        <span>Cargando usuarios...</span>
      </div>

      <div *ngIf="error && !loading" class="cbo-error">
        <i class="bi bi-exclamation-triangle"></i>
        {{ error }}
      </div>

      <div *ngIf="!loading && !error" class="cbo-options">
        <div
          class="cbo-option clear-option"
          (click)="selectUsuario(null)"
          *ngIf="!required"
        >
          <i class="bi bi-x-circle"></i>
          <span>Limpiar selección</span>
        </div>

        <div
          *ngFor="let usuario of filteredUsuarios"
          class="cbo-option usuario-option"
          [class.selected]="selectedValue === usuario.id"
          (click)="selectUsuario(usuario)"
        >
          <div class="usuario-info">
            <div class="usuario-main">
              <span class="usuario-nombre">{{ usuario.nombre }}</span>
              <span class="usuario-rol badge bg-primary ms-2">{{
                usuario.rolNombre
              }}</span>
            </div>
            <small class="usuario-email text-muted">{{ usuario.email }}</small>
          </div>
        </div>

        <div
          *ngIf="filteredUsuarios.length === 0 && !loading"
          class="cbo-no-results"
        >
          <i class="bi bi-search"></i>
          <span>No se encontraron usuarios</span>
        </div>
      </div>
    </div>
  </div>
</div>
