<div class="cbo-planes-wrapper">
  <div
    class="search-container"
    [class.has-error]="hasErrors()"
    [class.is-expanded]="isOpen"
  >
    <div class="search-input-group">
      <input
        [id]="isId"
        [value]="isOpen ? searchControl.value || '' : placeholder"
        [disabled]="isDisabled"
        [readonly]="!isOpen"
        [class.error]="hasErrors()"
        class="search-input"
        (click)="onMainInputClick()"
        (focus)="onMainInputFocus()"
        (blur)="onMainInputBlur()"
        (input)="onMainInputChange($event)"
        autocomplete="off"
      />

      <button
        *ngIf="selectedPlan && !isDisabled && isOpen"
        type="button"
        class="clear-button"
        (click)="clearSelection()"
        title="Limpiar selección"
      >
        <i class="pi pi-times"></i>
      </button>

      <div *ngIf="isLoading" class="loading-spinner">
        <i class="pi pi-spinner pi-spin"></i>
      </div>

      <div
        *ngIf="!isLoading"
        class="dropdown-arrow"
        (click)="toggleDropdown($event)"
      >
        <i class="pi pi-chevron-down" [class.rotated]="isOpen"></i>
      </div>
    </div>

    <div *ngIf="isOpen && !isDisabled" class="dropdown-panel">
      <div class="dropdown-content">
        <div *ngIf="planes.length === 0 && !isLoading" class="no-results">
          <i
            class="pi pi-search"
            style="font-size: 1.5rem; margin-bottom: 8px; opacity: 0.5"
          ></i>
          <div *ngIf="searchControl.value && searchControl.value.length < 1">
            Ingrese texto para buscar
          </div>
          <div *ngIf="searchControl.value && searchControl.value.length >= 1">
            No se encontraron planes
          </div>
          <div *ngIf="!searchControl.value">No hay planes disponibles</div>
        </div>

        <div
          *ngFor="let plan of planes; trackBy: trackByPlan"
          class="dropdown-option"
          [class.selected]="selectedPlan?.id === plan.id"
          (click)="onOptionClick(plan)"
        >
          <div class="option-content">
            <div class="option-main">
              <span class="option-nombre" [title]="plan.nombre">{{
                plan.nombre
              }}</span>
              <span class="option-desc" *ngIf="plan.descripcion">
                - {{ plan.descripcion }}</span
              >
            </div>
            <div class="option-details">
              <span
                class="option-price"
                *ngIf="plan.precioUsd !== undefined && plan.precioUsd !== null"
              >
                ${{ plan.precioUsd }}
              </span>
              <span class="option-status" *ngIf="!plan.activo">
                (inactivo)</span
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="hasErrors()" class="error-message">{{ getErrorMessage() }}</div>

  <div *ngIf="isLoading && !isOpen" class="loading-indicator">
    <i class="pi pi-spinner pi-spin"></i>
    <span>Cargando planes...</span>
  </div>
</div>
