<div class="imagen-upload-container">
  <div class="card">
    <div class="card-body">
      <h5 class="card-title mb-3">
        <i class="bi bi-cloud-upload"></i> Subir Imagen
      </h5>

      <!-- Indicador de límite -->
      <div class="limit-indicator mb-3">
        <small class="text-muted">
          {{ totalSubidas }} de {{ maxImagenes ?? '∞' }} imágenes
        </small>
        <div class="progress" style="height: 4px;">
          <div
            class="progress-bar"
            [style.width.%]="
              maxImagenes !== null ? (totalSubidas / maxImagenes) * 100 : 0
            "
          ></div>
        </div>
      </div>

      <!-- Zona drag-and-drop -->
      <div
        class="drop-zone"
        [class.dragover]="dragover"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
        [class.disabled]="!puedoSubir() || subiendo"
      >
        <input
          #fileInput
          type="file"
          accept="image/jpeg,image/png,image/webp"
          (change)="onFileSelected($event)"
          style="display: none"
          [disabled]="!puedoSubir() || subiendo"
        />

        <div class="drop-zone-content">
          <i class="bi bi-image"></i>
          <p class="mb-2">
            Arrastra una imagen aquí o haz clic para seleccionar
          </p>
          <small class="text-muted">JPG, PNG o WEBP (máx 5MB)</small>
        </div>

        <button
          type="button"
          class="btn btn-sm btn-outline-primary mt-3"
          (click)="fileInput.click()"
          [disabled]="!puedoSubir() || subiendo"
        >
          <i class="bi bi-folder-open"></i> Seleccionar Archivo
        </button>
      </div>

      <!-- Preview -->
      <div *ngIf="previewUrl" class="preview-section mt-3">
        <img [src]="previewUrl" alt="Preview" class="preview-image" />
      </div>

      <!-- Mensajes -->
      <div
        *ngIf="mensaje"
        [class]="'alert mt-3 mb-0 alert-' + (tipoMensaje === 'error' ? 'danger' : 'info')"
      >
        <i
          [class]="
            tipoMensaje === 'error'
              ? 'bi bi-exclamation-circle'
              : 'bi bi-check-circle'
          "
        ></i>
        {{ mensaje }}
      </div>

      <!-- Barra de progreso -->
      <div *ngIf="subiendo" class="progress mt-3" style="height: 20px;">
        <div
          class="progress-bar progress-bar-striped progress-bar-animated"
          [style.width.%]="progreso"
          role="progressbar"
          [attr.aria-valuenow]="progreso"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          {{ progreso }}%
        </div>
      </div>

      <!-- Botón de subida -->
      <div class="mt-3">
        <button
          type="button"
          class="btn btn-primary w-100"
          (click)="subirImagen()"
          [disabled]="!archivoSeleccionado || !puedoSubir() || subiendo"
        >
          <i
            [class]="
              subiendo ? 'bi bi-hourglass-split' : 'bi bi-cloud-upload'
            "
          ></i>
          {{ subiendo ? "Subiendo..." : "Subir Imagen" }}
        </button>
        <button
          *ngIf="archivoSeleccionado && !subiendo"
          type="button"
          class="btn btn-secondary w-100 mt-2"
          (click)="limpiar()"
        >
          Cancelar
        </button>
      </div>

      <!-- Aviso de límite alcanzado -->
      <div *ngIf="!puedoSubir()" class="alert alert-warning mt-3 mb-0">
        <i class="bi bi-exclamation-triangle"></i> Has alcanzado el límite de
        imágenes de tu plan.
      </div>
    </div>
  </div>
</div>
