<div class="cbo-propiedades-wrapper position-relative">
  <div class="input-group">
    <input
      type="text"
      class="form-control"
      [value]="selectedPropiedadName()"
      [placeholder]="placeholder"
      [disabled]="disabled"
      readonly
      (click)="onMainInputClick()"
      (focus)="onMainInputFocus()"
      (blur)="onMainInputBlur()"
    />
    <button
      type="button"
      class="btn btn-outline-secondary"
      [disabled]="disabled"
      (click)="toggleDropdown()"
    >
      <i
        class="fas"
        [class.fa-chevron-down]="!isOpen"
        [class.fa-chevron-up]="isOpen"
      ></i>
    </button>
    <button
      *ngIf="selectedPropiedadId"
      type="button"
      class="btn btn-outline-secondary"
      [disabled]="disabled"
      (click)="clearSelection()"
      title="Limpiar selección"
    >
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- Dropdown -->
  <div
    class="dropdown-menu w-100"
    [class.show]="isOpen"
    style="max-height: 300px; overflow-y: auto; z-index: 1050"
  >
    <!-- Search input -->
    <div class="px-3 py-2 border-bottom">
      <input
        type="text"
        class="form-control form-control-sm"
        placeholder="Buscar propiedad..."
        [formControl]="searchControl"
        (click)="$event.stopPropagation()"
      />
    </div>

    <!-- Loading -->
    <div *ngIf="isLoading" class="text-center py-3">
      <div class="spinner-border spinner-border-sm" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <small class="d-block mt-1 text-muted">Cargando propiedades...</small>
    </div>

    <!-- No results -->
    <div
      *ngIf="!isLoading && propiedades.length === 0"
      class="px-3 py-2 text-muted"
    >
      <i class="fas fa-info-circle me-1"></i>
      No se encontraron propiedades
    </div>

    <!-- Property options -->
    <ng-container *ngIf="!isLoading && propiedades.length > 0">
      <button
        *ngFor="let propiedad of propiedades; trackBy: trackByPropiedad"
        type="button"
        class="dropdown-item d-flex align-items-center"
        [class.active]="propiedad.id === selectedPropiedadId"
        (click)="onOptionClick(propiedad)"
      >
        <div class="flex-grow-1">
          <div class="fw-medium">{{ propiedad.titulo }}</div>
          <small class="text-muted">
            <i class="fas fa-map-marker-alt me-1"></i>
            {{ propiedad.direccion }}
          </small>
          <div *ngIf="propiedad.precio" class="small text-success">
            <i class="fas fa-dollar-sign me-1"></i>
            {{ propiedad.precio | currency: "USD" : "symbol" : "1.0-0" }}
          </div>
        </div>
        <i
          *ngIf="propiedad.id === selectedPropiedadId"
          class="fas fa-check text-primary ms-2"
        ></i>
      </button>
    </ng-container>
  </div>
</div>
