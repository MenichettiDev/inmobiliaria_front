<!-- Título y botón en la misma línea -->
<div class="container-fluid page-shell page-header-container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div></div>
    <a class="header-action" (click)="createNewCliente()" role="button">
      <i class="bx bx-plus bx-tada" aria-hidden="true"></i> Agregar
    </a>
  </div>
</div>

<div
  class="cliente-list-container visor-clientes container-fluid page-shell mt-2"
>
  <div class="pyre-table-shell">
    <!-- Filter bar -->
    <div class="pyre-filter-bar container-fluid">
      <div class="row g-3 align-items-end">
        <!-- Nombre -->
        <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6">
          <div class="filter-item">
            <div class="filter-input-group">
              <input
                type="text"
                class="form-control"
                [(ngModel)]="filtroNombre"
                placeholder="Nombre completo"
                (keyup.enter)="onSearch()"
              />
            </div>
          </div>
        </div>

        <!-- Email -->
        <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6">
          <div class="filter-item">
            <div class="filter-input-group">
              <input
                type="text"
                class="form-control"
                [(ngModel)]="filtroEmail"
                placeholder="Email"
                (keyup.enter)="onSearch()"
              />
            </div>
          </div>
        </div>

        <!-- Teléfono -->
        <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6">
          <div class="filter-item">
            <div class="filter-input-group">
              <input
                type="text"
                class="form-control"
                [(ngModel)]="filtroTelefono"
                placeholder="Teléfono"
                (keyup.enter)="onSearch()"
              />
            </div>
          </div>
        </div>

        <!-- Reset + Buscar -->
        <div
          class="col-xl-3 col-lg-3 col-md-12 col-sm-12 d-flex justify-content-end"
        >
          <div class="d-flex gap-2">
            <button
              type="button"
              class="reset-button-inline"
              (click)="onResetFilters()"
              [disabled]="!hasActiveFilters()"
              [title]="
                hasActiveFilters()
                  ? 'Limpiar filtros'
                  : 'No hay filtros activos'
              "
            >
              <i class="pi pi-filter-slash"></i>
            </button>

            <button
              type="button"
              class="btn btn-primary"
              (click)="onSearch()"
              title="Buscar"
            >
              <i class="pi pi-search"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Spinner global -->
    <app-spinner [isLoading]="isLoading"></app-spinner>

    <!-- Custom table -->
    <div *ngIf="!isLoading" class="custom-table-container">
      <table class="custom-table">
        <thead>
          <tr>
            <th>Nombre completo</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>DNI</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cliente of getPaginatedClientes(); let i = index">
            <td>{{ cliente.nombreCompleto }}</td>
            <td>{{ cliente.email }}</td>
            <td>{{ cliente.telefono }}</td>
            <td>{{ cliente.dni }}</td>
            <td>
              <span
                class="badge"
                [class.badge-success]="cliente.activo"
                [class.badge-secondary]="!cliente.activo"
              >
                {{ cliente.activo ? "Activo" : "Inactivo" }}
              </span>
            </td>
            <td>
              <div class="action-buttons">
                <button
                  type="button"
                  class="btn-icon btn-edit"
                  (click)="editCliente(cliente)"
                  ngbTooltip="Ver/Editar cliente"
                  placement="top"
                  container="body"
                >
                  <i class="pi pi-eye"></i>
                </button>
                <button
                  type="button"
                  class="btn-icon btn-delete"
                  (click)="deleteCliente(cliente)"
                  ngbTooltip="Eliminar cliente"
                  placement="top"
                  container="body"
                >
                  <i class="pi pi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="getPaginatedClientes().length === 0">
            <td colspan="6" class="empty-message">
              No se encontraron clientes.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Paginador -->
    <div *ngIf="!isLoading && totalItems > 0" class="paginator-container">
      <app-paginator
        [length]="totalItems"
        [pageSize]="pageSize"
        [pageIndex]="currentPage - 1"
        (pageChange)="onPageEvent($event)"
      >
      </app-paginator>
    </div>
  </div>
</div>
