<div class="cbo-fuentes">
  <div class="d-flex align-items-center gap-2">
    <select
      class="form-select form-select-sm"
      [(ngModel)]="selectedId"
      (ngModelChange)="selectedIdChange.emit($event)"
      [disabled]="loading"
    >
      <option [ngValue]="null">Sin especificar</option>
      <option *ngFor="let f of fuentes; trackBy: trackById" [ngValue]="f.id">
        {{ f.nombre }}
      </option>
    </select>

    <span
      *ngIf="loading"
      class="spinner-border spinner-border-sm"
      role="status"
      aria-hidden="true"
    ></span>
  </div>

  <div *ngIf="error" class="text-danger small mt-1">{{ error }}</div>
</div>
