<div class="cbo-roles-wrapper position-relative">
  <div class="input-group">
    <input
      type="text"
      class="form-control"
      [value]="selectedRolName()"
      [placeholder]="placeholder"
      [disabled]="disabled"
      readonly
      (click)="onMainInputClick()"
      (focus)="onMainInputFocus()"
      (blur)="onMainInputBlur()"
    />
    <button
      type="button"
      class="btn btn-outline-secondary"
      [disabled]="disabled"
      (click)="toggleDropdown()"
    >
      <i
        class="fas"
        [class.fa-chevron-down]="!isOpen"
        [class.fa-chevron-up]="isOpen"
      ></i>
    </button>
    <button
      *ngIf="selectedRolId"
      type="button"
      class="btn btn-outline-secondary"
      [disabled]="disabled"
      (click)="clearSelection()"
      title="Limpiar selección"
    >
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- Dropdown -->
  <div
    class="dropdown-menu w-100"
    [class.show]="isOpen"
    style="max-height: 300px; overflow-y: auto; z-index: 1050"
  >
    <!-- Search input -->
    <div class="px-3 py-2 border-bottom">
      <input
        type="text"
        class="form-control form-control-sm"
        placeholder="Buscar rol..."
        [formControl]="searchControl"
        (click)="$event.stopPropagation()"
      />
    </div>

    <!-- Loading -->
    <div *ngIf="isLoading" class="text-center py-3">
      <div class="spinner-border spinner-border-sm" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <small class="d-block mt-1 text-muted">Cargando roles...</small>
    </div>

    <!-- No results -->
    <div *ngIf="!isLoading && roles.length === 0" class="px-3 py-2 text-muted">
      <i class="fas fa-info-circle me-1"></i>
      No se encontraron roles
    </div>

    <!-- Role options -->
    <ng-container *ngIf="!isLoading && roles.length > 0">
      <button
        *ngFor="let rol of roles; trackBy: trackByRol"
        type="button"
        class="dropdown-item d-flex align-items-center"
        [class.active]="rol.idRol === selectedRolId"
        (click)="onOptionClick(rol)"
      >
        <div class="flex-grow-1">
          <div class="fw-medium">{{ rol.nombreRol }}</div>
          <small class="text-muted" *ngIf="rol.descripcion">
            {{ rol.descripcion }}
          </small>
        </div>
        <i
          *ngIf="rol.idRol === selectedRolId"
          class="fas fa-check text-primary ms-2"
        ></i>
      </button>
    </ng-container>
  </div>
</div>
