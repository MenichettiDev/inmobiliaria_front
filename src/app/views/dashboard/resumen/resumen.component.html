<div class="dashboard-container">
  <div class="dashboard-header">
    <h1 class="dashboard-title">Dashboard</h1>
    <div class="date-filter">
      <label for="date-select" class="date-label">Filtrar por:</label>
      <select id="date-select" class="form-select">
        <option>Hoy</option>
        <option>Esta semana</option>
        <option>Este mes</option>
      </select>
    </div>
  </div>

  <!-- Accesos Rápidos -->
  <div class="quick-actions">
    <h3 class="section-title">Accesos Rápidos</h3>
    <div class="action-buttons">
      <button class="btn btn-primary" routerLink="/leads/crear">
        <i class="bi bi-person-plus"></i>
        Nuevo Lead
      </button>
      <button class="btn btn-success" routerLink="/propiedades/crear">
        <i class="bi bi-house-add"></i>
        Nueva Propiedad
      </button>
      <button class="btn btn-info" routerLink="/agenda/crear-visita">
        <i class="bi bi-calendar-plus"></i>
        Agendar Visita
      </button>
    </div>
  </div>

  <!-- KPIs Cards -->
  <div class="kpis-section">
    <div class="row">
      <!-- KPI Card -->
      <div class="col-md-4 col-sm-6" *ngFor="let kpi of kpisList">
        <div class="kpi-card">
          <div class="kpi-icon">{{ kpi.icon }}</div>
          <div class="kpi-content">
            <h3 class="kpi-value">{{ kpi.value }}</h3>
            <p class="kpi-label">{{ kpi.label }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Alertas -->
  <div class="alerts-section" *ngIf="alertas.length > 0">
    <h3 class="section-title">Alertas Importantes</h3>
    <div class="alerts-container">
      <div
        *ngFor="let alerta of alertas"
        class="alert"
        [ngClass]="'alert-' + alerta.tipo"
      >
        {{ alerta.mensaje }}
      </div>
    </div>
  </div>

  <!-- Actividad Reciente -->
  <div class="activity-section">
    <h3 class="section-title">Actividad Reciente</h3>
    <div class="activity-list">
      <div *ngFor="let actividad of actividadReciente" class="activity-item">
        <div class="activity-time">{{ actividad.fecha }}</div>
        <div class="activity-description">{{ actividad.descripcion }}</div>
        <div class="activity-type">{{ actividad.tipo }}</div>
      </div>
    </div>
  </div>
</div>
