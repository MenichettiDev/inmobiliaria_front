<div class="fullscreen-background">
  <div class="container">
    <!-- Formulario reactivo con Angular -->
    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      aria-labelledby="login-form-title"
      autocomplete="off"
      novalidate
    >
      <div class="header-section">
        <div class="logo-container">
          <svg viewBox="0 0 120 120" class="company-logo" xmlns="http://www.w3.org/2000/svg">
            <!-- Punto central -->
            <circle cx="60" cy="60" r="8" fill="#667eea"/>
            <!-- Líneas convergentes desde esquinas -->
            <line x1="10" y1="10" x2="60" y2="60" stroke="#667eea" stroke-width="2" opacity="0.7"/>
            <line x1="110" y1="10" x2="60" y2="60" stroke="#667eea" stroke-width="2" opacity="0.7"/>
            <line x1="10" y1="110" x2="60" y2="60" stroke="#667eea" stroke-width="2" opacity="0.7"/>
            <line x1="110" y1="110" x2="60" y2="60" stroke="#667eea" stroke-width="2" opacity="0.7"/>
            <!-- Líneas desde medios -->
            <line x1="60" y1="10" x2="60" y2="60" stroke="#764ba2" stroke-width="2" opacity="0.6"/>
            <line x1="60" y1="110" x2="60" y2="60" stroke="#764ba2" stroke-width="2" opacity="0.6"/>
            <line x1="10" y1="60" x2="60" y2="60" stroke="#764ba2" stroke-width="2" opacity="0.6"/>
            <line x1="110" y1="60" x2="60" y2="60" stroke="#764ba2" stroke-width="2" opacity="0.6"/>
            <!-- Círculos pequeños en convergencia -->
            <circle cx="10" cy="10" r="3" fill="#667eea" opacity="0.5"/>
            <circle cx="110" cy="10" r="3" fill="#667eea" opacity="0.5"/>
            <circle cx="10" cy="110" r="3" fill="#667eea" opacity="0.5"/>
            <circle cx="110" cy="110" r="3" fill="#667eea" opacity="0.5"/>
            <circle cx="60" cy="10" r="3" fill="#764ba2" opacity="0.5"/>
            <circle cx="60" cy="110" r="3" fill="#764ba2" opacity="0.5"/>
            <circle cx="10" cy="60" r="3" fill="#764ba2" opacity="0.5"/>
            <circle cx="110" cy="60" r="3" fill="#764ba2" opacity="0.5"/>
          </svg>
        </div>
        <p class="subtitle">Gestión de Propiedades</p>
        <a routerLink="/portal" class="btn-back-to-portal">← Volver al Portal Público</a>
      </div>

      <div class="form-group">
        <label for="email" class="field-label">Correo Electrónico</label>
        <input
          type="email"
          formControlName="email"
          id="email"
          name="user-email"
          placeholder="Ingrese su correo electrónico"
          autocomplete="off"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required
        />
        <i class="bx bx-envelope" aria-label="Icono de correo"></i>
      </div>

      <div class="form-group">
        <label for="password" class="field-label">Contraseña</label>
        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          id="password"
          name="user-password"
          placeholder="Ingrese su contraseña"
          autocomplete="new-password"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required
        />
        <i
          class="password-toggle-icon bx {{
            showPassword ? 'bx-hide' : 'bx-show'
          }}"
          [attr.aria-label]="
            showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'
          "
          (mousedown)="onMouseDownPassword()"
          (mouseup)="onMouseUpPassword()"
          (mouseleave)="onMouseLeavePassword()"
          (touchstart)="onTouchStartPassword($event)"
          (touchend)="onTouchEndPassword($event)"
          [ngbTooltip]="'Mantener presionado para ver la contraseña'"
          container="body"
        >
        </i>
      </div>

      <button type="submit" class="btn">Acceder al Sistema</button>

      <div class="company-info">
        <p>Forest Developments</p>
      </div>
    </form>

    <!-- Spinner global para la pantalla de login -->
    <app-spinner [isLoading]="isLoading"></app-spinner>

    <!-- Toast-modal propio en lugar de SweetAlert2 -->
    <app-toast-modal
      [message]="toastMessage"
      [visible]="toastVisible"
      [type]="toastType"
    ></app-toast-modal>
  </div>
</div>
