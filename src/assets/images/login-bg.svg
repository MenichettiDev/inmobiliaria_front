<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2847;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a3a52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.3" />
    </radialGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="1200" height="800" fill="url(#gradBg)"/>

  <!-- Vignette overlay -->
  <rect width="1200" height="800" fill="url(#vignette)"/>

  <!-- House 1 (Left) -->
  <g transform="translate(150, 450)">
    <!-- Foundation -->
    <rect x="0" y="120" width="140" height="80" fill="#8B6F47"/>
    <!-- Wall -->
    <rect x="0" y="0" width="140" height="120" fill="#D4A574"/>
    <!-- Roof -->
    <polygon points="0,0 70,-50 140,0" fill="#8B4513"/>
    <!-- Door -->
    <rect x="50" y="80" width="40" height="60" fill="#5C3D2E"/>
    <circle cx="85" cy="110" r="3" fill="#FFD700"/>
    <!-- Window 1 -->
    <rect x="15" y="30" width="25" height="25" fill="#87CEEB"/>
    <line x1="27.5" y1="30" x2="27.5" y2="55" stroke="#4A90E2" stroke-width="1"/>
    <line x1="15" y1="42.5" x2="40" y2="42.5" stroke="#4A90E2" stroke-width="1"/>
    <!-- Window 2 -->
    <rect x="100" y="30" width="25" height="25" fill="#87CEEB"/>
    <line x1="112.5" y1="30" x2="112.5" y2="55" stroke="#4A90E2" stroke-width="1"/>
    <line x1="100" y1="42.5" x2="125" y2="42.5" stroke="#4A90E2" stroke-width="1"/>
  </g>

  <!-- House 2 (Center) -->
  <g transform="translate(520, 420)">
    <rect x="0" y="130" width="160" height="90" fill="#8B6F47"/>
    <rect x="0" y="0" width="160" height="130" fill="#CD853F"/>
    <polygon points="0,0 80,-60 160,0" fill="#A0522D"/>
    <rect x="60" y="90" width="40" height="70" fill="#5C3D2E"/>
    <circle cx="95" cy="130" r="3" fill="#FFD700"/>
    <rect x="15" y="35" width="28" height="28" fill="#87CEEB"/>
    <line x1="29" y1="35" x2="29" y2="63" stroke="#4A90E2" stroke-width="1"/>
    <line x1="15" y1="49" x2="43" y2="49" stroke="#4A90E2" stroke-width="1"/>
    <rect x="50" y="35" width="28" height="28" fill="#87CEEB"/>
    <line x1="64" y1="35" x2="64" y2="63" stroke="#4A90E2" stroke-width="1"/>
    <line x1="50" y1="49" x2="78" y2="49" stroke="#4A90E2" stroke-width="1"/>
    <rect x="85" y="35" width="28" height="28" fill="#87CEEB"/>
    <line x1="99" y1="35" x2="99" y2="63" stroke="#4A90E2" stroke-width="1"/>
    <line x1="85" y1="49" x2="113" y2="49" stroke="#4A90E2" stroke-width="1"/>
    <rect x="120" y="35" width="28" height="28" fill="#87CEEB"/>
    <line x1="134" y1="35" x2="134" y2="63" stroke="#4A90E2" stroke-width="1"/>
    <line x1="120" y1="49" x2="148" y2="49" stroke="#4A90E2" stroke-width="1"/>
  </g>

  <!-- House 3 (Right) -->
  <g transform="translate(900, 480)">
    <rect x="0" y="110" width="130" height="70" fill="#8B6F47"/>
    <rect x="0" y="0" width="130" height="110" fill="#D2B48C"/>
    <polygon points="0,0 65,-45 130,0" fill="#8B4513"/>
    <rect x="45" y="70" width="40" height="50" fill="#5C3D2E"/>
    <circle cx="75" cy="100" r="3" fill="#FFD700"/>
    <rect x="10" y="25" width="24" height="24" fill="#87CEEB"/>
    <line x1="22" y1="25" x2="22" y2="49" stroke="#4A90E2" stroke-width="1"/>
    <line x1="10" y1="37" x2="34" y2="37" stroke="#4A90E2" stroke-width="1"/>
    <rect x="95" y="25" width="24" height="24" fill="#87CEEB"/>
    <line x1="107" y1="25" x2="107" y2="49" stroke="#4A90E2" stroke-width="1"/>
    <line x1="95" y1="37" x2="119" y2="37" stroke="#4A90E2" stroke-width="1"/>
  </g>

  <!-- Person 1 (Left) -->
  <g transform="translate(220, 300)">
    <!-- Head -->
    <circle cx="0" cy="0" r="15" fill="#D4A574"/>
    <!-- Body -->
    <rect x="-12" y="15" width="24" height="40" fill="#2C3E50" rx="3"/>
    <!-- Arms -->
    <line x1="-12" y1="25" x2="-35" y2="15" stroke="#D4A574" stroke-width="8" stroke-linecap="round"/>
    <line x1="12" y1="25" x2="35" y2="15" stroke="#D4A574" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="-6" y1="55" x2="-6" y2="85" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
    <line x1="6" y1="55" x2="6" y2="85" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Person 2 (Center) -->
  <g transform="translate(600, 280)">
    <circle cx="0" cy="0" r="16" fill="#D4A574"/>
    <rect x="-13" y="16" width="26" height="42" fill="#34495E" rx="3"/>
    <line x1="-13" y1="27" x2="-38" y2="12" stroke="#D4A574" stroke-width="9" stroke-linecap="round"/>
    <line x1="13" y1="27" x2="38" y2="12" stroke="#D4A574" stroke-width="9" stroke-linecap="round"/>
    <line x1="-7" y1="58" x2="-7" y2="90" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
    <line x1="7" y1="58" x2="7" y2="90" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Person 3 (Right) -->
  <g transform="translate(950, 310)">
    <circle cx="0" cy="0" r="15" fill="#D4A574"/>
    <rect x="-11" y="15" width="22" height="38" fill="#2C3E50" rx="3"/>
    <line x1="-11" y1="24" x2="-32" y2="16" stroke="#D4A574" stroke-width="7" stroke-linecap="round"/>
    <line x1="11" y1="24" x2="32" y2="16" stroke="#D4A574" stroke-width="7" stroke-linecap="round"/>
    <line x1="-5" y1="53" x2="-5" y2="80" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
    <line x1="5" y1="53" x2="5" y2="80" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Connecting lines (people to houses) -->
  <g stroke="#FFD700" stroke-width="2" stroke-dasharray="5,5" fill="none" opacity="0.6">
    <!-- Left person to left house -->
    <path d="M 235,380 Q 250,420 225,450"/>
    <!-- Center person to center house -->
    <path d="M 600,360 Q 600,390 600,420"/>
    <!-- Right person to right house -->
    <path d="M 950,390 Q 935,430 935,480"/>
  </g>

  <!-- Decorative key icon (top right area) -->
  <g transform="translate(1000, 100)" fill="#FFD700" opacity="0.4">
    <rect x="0" y="0" width="30" height="18" rx="3"/>
    <circle cx="40" cy="9" r="8"/>
  </g>

  <!-- Decorative chart bars (bottom left) -->
  <g transform="translate(80, 680)" fill="#4CAF50" opacity="0.3">
    <rect x="0" y="20" width="12" height="40"/>
    <rect x="18" y="10" width="12" height="50"/>
    <rect x="36" y="25" width="12" height="35"/>
  </g>
</svg>